[project]
name = "mcp-midi-writer"
version = "0.1.0"
description = "MCP server for generating MIDI files from musical roles and sections"
readme = "README.md"
requires-python = ">=3.11.0"
dependencies = [
    "fastmcp==0.4.1",
    "mido>=1.3.2",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project.scripts]
mcp-midi-writer = "mcp_midi_writer:main"

[tool.poetry.scripts]
mcp-midi-writer = "mcp_midi_writer:main"

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]
